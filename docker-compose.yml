services:
  postgres:
    image: postgres:16-alpine
    container_name: cdms_postgres
    restart: always
    environment:
      POSTGRES_USER: cdms_user
      POSTGRES_PASSWORD: cdms_password
      POSTGRES_DB: cdms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdms_user -d cdms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock_vietful:
    build:
      context: .
      dockerfile: mock_vietful/Dockerfile
    container_name: cdms_mock_vietful
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1

  cdms_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cdms_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=cdms_user
      - POSTGRES_PASSWORD=cdms_password
      - POSTGRES_DB=cdms_db
      - VIETFUL_API_URL=http://mock_vietful:8001
      - POLLING_INTERVAL_SECONDS=10
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      mock_vietful:
        condition: service_started

  cdms_frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cdms_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - cdms_backend
      - mock_vietful

volumes:
  postgres_data:
